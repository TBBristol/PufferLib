[base]
package = ocean
env_name = puffer_stacking
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 4092
max_ep_steps = 100
num_containers = 30
num_stacks = None
max_height = 4

#10c/3s/5h trains ok

[sweep]
method = Protein 
metric = env.unsorted
goal = maximize
downsample = 10

[train]
total_timesteps = 10_000_000
gamma = 0.95
learning_rate = 0.05
minibatch_size = 32768
num_workers = auto
device= 'cpu'

[sweep.env.reward_max_breach] #-10 default
distribution = int_uniform
min = -10
max = 0
mean = -5
scale = auto

[sweep.env.reset_max_breach] #1 default
distribution = int_uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto
