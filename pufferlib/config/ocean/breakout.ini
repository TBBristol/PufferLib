[base]
package = ocean
env_name = puffer_breakout
policy_name = Actor
rnn_name = None

[vec]

[env]
num_envs = 1
frameskip = 1
width = 576
height = 330
paddle_width = 62
paddle_height = 8
ball_width = 32
ball_height = 32
brick_width = 32
brick_height = 12
brick_rows = 6
brick_cols = 18
initial_ball_speed = 256
max_ball_speed = 448
paddle_speed = 620
continuous = 1
 
[policy]

[rnn]
input_size = 128
hidden_size = 128

[train]
total_timesteps = 90_000_000


[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 8e7
scale = auto

[sweep.env.frameskip]
distribution = int_uniform
min = 1
max = 8
mean = 4
scale = 2.0
