[base]
package = ocean
env_name = puffer_breakout
policy_name = Actor
rnn_name = None


[env]
num_envs = 1024
frameskip = 4
width = 576
height = 330
paddle_width = 62
paddle_height = 8
ball_width = 32
ball_height = 32
brick_width = 32
brick_height = 12
brick_rows = 6
brick_cols = 18
initial_ball_speed = 256
max_ball_speed = 448
paddle_speed = 620
continuous = 1

[train]



 
[sweep.train.num_envs]
distribution = uniform_pow2
min = 1
max = 1024
mean = 1024
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 50000
max = 5000000
mean = 400000
scale = time


[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 128
max = 2048
mean = 128
scale = auto

[sweep.train.q_lr]
distribution = log_normal
min = 0.000001
mean = 0.01
max = 1e-2
scale = 0.5

[sweep.train.policy_lr]
distribution = log_normal
min = 0.000001
mean = 0.001
max = 1e-2
scale = 0.5

[sweep.target_network_update_freq]
distribution = int_uniform
min = 1
max = 8
mean = 1
scale = 2.0

[sweep.train.policy_freq]
distribution = int_uniform
min = 1
max = 12
mean = 8
scale = 2.0

[sweep.train.tau]
distribution = log_normal
min = 0.00001
mean = 0.1
max = 0.2
scale = 0.5

[sweep.train.gamma]
distribution = log_normal
min = 0.8
mean = 0.95
max = 0.9999
scale = auto

[sweep.train.hidden_size]
distribution = uniform_pow2
min = 128
max = 1024
mean = 128
scale = auto

[sweep.train.learning_starts]
distribution = log_normal
min = 50000      
mean = 80000    
max = 200000    
scale = 0.5

[sweep.train.train_ratio]
distribution = uniform
min = 0.1
max = 1.0
mean = 0.1
scale = auto
