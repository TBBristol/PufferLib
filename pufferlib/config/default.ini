[base]
package = None
env_name = None
policy_name = Policy
rnn_name = None
max_suggestion_cost = 3600

[vec]
backend = Multiprocessing
num_envs = 2
num_workers = auto
batch_size = auto
zero_copy = True
seed = 42

[env]
[policy]
skill_dim = 2 #MUST MATCH WITH TRAIN.SKILL_DIM
[rnn]

[train]

skill_dim = 2
num_skills = 2 #MUST MATCH WITH POLICY.SKILL_DIM
phi_hidden = 128
inital_lambda = 1
lr_phi = 5e-3
lr_lambda = 1e-5
dual_slack = 1e-2
disc_skill = True
intrinsic_reward_scaling = 12
ppo_reward_scaling = 1
phi_updates = 24

name = pufferai 
project = ablations

seed = 42
torch_deterministic = True
cpu_offload = False
device = cuda
optimizer = muon
anneal_lr = True
precision = float32
total_timesteps = 100000000
learning_rate = 3e-4
gamma = 0.995
gae_lambda = 0.90
update_epochs = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.03
adam_beta1 = 0.95
adam_beta2 = 0.999
adam_eps = 1e-12

data_dir = experiments
checkpoint_interval = 200
batch_size = 65536
minibatch_size = 32768

# Accumulate gradients above this size
max_minibatch_size = 32768
bptt_horizon = 64
compile = False
compile_mode = max-autotune-no-cudagraphs
compile_fullgraph = True

vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

prio_alpha = 0.8
prio_beta0 = 0.2

[sweep]
method = Protein 
metric = Cos_align
goal = maximize
downsample = 10

[sweep.train.ppo_reward_scaling]
distribution = uniform
min = 1
max = 20
mean = 10
scale = auto

[sweep.train.lr_lambda]
distribution = log_normal
min = 1e-5
mean = 2e-4     
max = 1e-3
scale = auto

[sweep.train.lr_phi]
distribution = log_normal
min = 1e-6
mean = 1e-5
max = 1e-4
scale = auto

[sweep.train.inital_lambda]
distribution = uniform
min = 1
max = 30
mean = 1
scale = auto

[sweep.train.dual_slack]
distribution = log_normal
min = 1e-4
mean = 1e-2
max = 1e-1
scale = auto

[sweep.train.intrinsic_reward_scaling]
distribution = uniform
min = 1
max = 10
mean = 5
scale = auto

#[sweep.vec.num_envs]
#distribution = uniform_pow2
#min = 1
#max = 16
#mean = 8
#scale = auto

# TODO: Elim from base
[sweep.train.total_timesteps]
distribution = log_normal
min = 5000000
max = 30000000
mean = 20000000
scale = time

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 16
max = 64
mean = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
#8192
min = 512 
#65536
max = 16384 
#32768
mean = 8192 
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
mean = 0.02
max = 0.2
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
mean = 0.01
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
mean = 0.98
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.6
mean = 0.95
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.0
max = 5.0
mean = 1.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.0
max = 5.0
mean = 1.0
scale = auto

[sweep.train.update_epochs]
distribution = int_uniform
min = 1
max = 6
mean = 1
scale = 2.0

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 1.0
mean = 0.2
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 5.0
mean = 0.2
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.0
max = 5.0
mean = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.0
mean = 1.0
max = 5.0
scale = auto

[sweep.train.adam_beta1]
distribution = logit_normal
min = 0.5
mean = 0.8
max = 0.999
scale = auto

[sweep.train.adam_beta2]
distribution = logit_normal
min = 0.9
mean = 0.999
max = 0.99999
scale = auto

[sweep.train.adam_eps]
distribution = log_normal
min = 1e-14
mean = 1e-8
max = 1e-4
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.1
mean = 0.85
max = 0.99
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.1
mean = 0.85
max = 0.99
scale = auto
