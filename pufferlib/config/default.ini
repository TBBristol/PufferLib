[base]
package = None
env_name = None
policy_name = Policy
rnn_name = None
max_suggestion_cost = 3600

[vec]
backend = Multiprocessing
num_envs = 1
num_workers = auto
batch_size = auto
zero_copy = True
seed = 42

[env]
num_envs = 1024
[policy]
[rnn]

[train]
learning_rate = 3e-4
bptt_horizon = 64
update_epochs = 1
max_minibatch_size = 32768
ent_coef = 0.001
max_grad_norm = 1.0
critic_coef = 1.0
deliberation_cost = 0.1
num_options = 4
option_epsilon = 0.1
buffer_size = 1e6 
learning_starts = 5e3
tau = 0.002
gamma = 0.99
minibatch_size = 512
hidden_size = 256

name = pufferai

project = ablations

seed = 42
torch_deterministic = True
cpu_offload = False
device = cuda
precision = float32
total_timesteps = 1_000_000

data_dir = experiments
checkpoint_interval = 200
batch_size = auto

# Accumulate gradients above this size
compile = False
compile_mode = max-autotune-no-cudagraphs
compile_fullgraph = True

[sweep]
method = Protein 
metric = score
goal = maximize
downsample = 5
use_gpu = True
prune_pareto = True

#[sweep.vec.num_envs]
#distribution = uniform_pow2
#min = 1
#max = 16
#scale = auto

# TODO: Elim from base
[sweep.train.total_timesteps]
distribution = log_normal
min = 50000
max = 5000000
mean = 1000000
scale = time

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 16
max = 64
mean = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 64
max = 8192
mean = 512
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.01
mean = 3e-4
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
mean = 0.001
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
mean = 0.99
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
mean = 1.0
scale = auto

[sweep.train.critic_coef]
distribution = uniform
min = 0.1
max = 5.0
mean = 1.0
scale = auto

[sweep.train.deliberation_cost]
distribution = log_normal
min = 0.001
max = 1.0
mean = 0.1
scale = auto

[sweep.train.num_options]
distribution = int_uniform
min = 2
max = 8
mean = 4
scale = auto

[sweep.train.option_epsilon]
distribution = uniform
min = 0.01
max = 0.3
mean = 0.1
scale = auto

[sweep.train.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
mean = 256
scale = auto
