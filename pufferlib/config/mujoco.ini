[base]
package = mujoco
env_name = HalfCheetah-v4 Hopper-v4 Swimmer-v4 Walker2d-v4 Ant-v4 Humanoid-v4 Reacher-v4 InvertedPendulum-v4 InvertedDoublePendulum-v4 Pusher-v4 HumanoidStandup-v4
policy_name = Actor
rnn_name = None

[env]
render_mode = rgb_array
exclude_current_positions_from_observation = True
terminate_when_unhealthy = True

[vec]
num_envs = 1024
num_workers = 8
batch_size = auto

[train]

alpha = 0.006
autotune = True
batch_size = auto
buffer_size = 1000000
checkpoint_interval = 200
gamma = 0.9621621862619114
hidden_size = 64
learning_starts = 200000.00000000003
max_runtime = 1200
minibatch_size = 128 
policy_freq = 1
policy_lr = 0.002273155094047683
q_lr = 0.015205910791237186
target_network_update_freq = 1 
tau = 0.031488894625419456
total_timesteps = 1000000
train_ratio = 0.042540482876716613

[sweep]
method = Protein 
metric = episode_return
goal = maximize
downsample = 10




[sweep.train.total_timesteps]
distribution = log_normal
min = 50000
max = 1000000
mean = 1000000
scale = time


[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 64
max = 256
mean = 128
scale = auto

[sweep.train.q_lr]
distribution = log_normal
min = 0.00001
mean = 3e-2
max = 5e-2
scale = 0.5

[sweep.train.policy_lr]
distribution = log_normal
min = 0.00001
mean = 1e-3
max = 5e-2
scale = 0.5

[sweep.target_network_update_freq]
distribution = int_uniform
min = 0.1
max = 8
mean = 1
scale = auto

[sweep.train.policy_freq]
distribution = int_uniform
min = 1
max = 12
mean = 1
scale = 2.0

[sweep.train.tau]
distribution = log_normal
min = 0.00001
mean = 0.1
max = 0.5
scale = 0.5

[sweep.train.gamma]
distribution = log_normal
min = 0.8
mean = 0.95
max = 0.9999
scale = auto

[sweep.train.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
mean = 128
scale = auto

[sweep.train.learning_starts]
distribution = log_normal
min = 50000      
mean = 80000    
max = 200000    
scale = 0.5

[sweep.train.train_ratio]
distribution = log_normal
min = 0.001
max = 0.2
mean = 0.03
scale = auto
