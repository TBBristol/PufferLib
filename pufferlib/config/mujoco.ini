[base]
package = mujoco
env_name = HalfCheetah-v4 Hopper-v4 Swimmer-v4 Walker2d-v4 Ant-v4 Humanoid-v4 Reacher-v4 InvertedPendulum-v4 InvertedDoublePendulum-v4 Pusher-v4 HumanoidStandup-v4
policy_name = Policy
rnn_name = Recurrent

[env]
render_mode = rgb_array

[policy]
lambda_lr = 0.06440637432702243
phi_dim = 4

[train]
adam_beta1 = 0.8491540796549305
adam_beta2 = 0.9897345075048444
adam_eps = 8.97831900234994e-09
anneal_lr = True
batch_size = auto
bptt_horizon = 64
checkpoint_interval = 200
clip_coef = 0.43061293889547203
compile = False
compile_fullgraph = True
compile_mode = max-autotune-no-cudagraphs
cpu_offload = False
data_dir = experiments
device = cuda
ent_coef = 9.978834549661439e-05
gae_lambda = 0.8913863793240697
gamma = 0.9895392516590218
learning_rate = 0.1
max_grad_norm = 2.1344086565175218
max_minibatch_size = 32768
metra = True
metra_epsilon = 0.01
metra_num_skills = 4
metra_phi_dim = 4
minibatch_size = 32768
name = pufferai
optimizer = muon
precision = float32
prio_alpha = 0.7509371710340584
prio_beta0 = 0.9704252345439494
project = ablations
seed = 42
torch_deterministic = True
total_timesteps = 5000000
update_epochs = 1
use_rnn = True
vf_clip_coef = 2.034621033242285
vf_coef = 5
vtrace_c_clip = 0.9441201980744335
vtrace_rho_clip = 1.293515737115144

[vec]
backend = Multiprocessing
batch_size = auto
num_envs = 512
num_workers = 8
seed = 42
zero_copy = True

[sweep]
method = Protein 
metric = intrinsic_return
goal = maximize
downsample = 10

#[sweep.vec.num_envs]
#distribution = uniform_pow2
#min = 1
#max = 16
#mean = 8
#scale = auto
#
[sweep.policy.lambda_lr]
distribution = log_normal
min = 1e-5
max = 1e-1
mean = 0.06440637432702243
scale = auto

# TODO: Elim from base
[sweep.train.total_timesteps]
distribution = log_normal
min = 5e6
max = 5e7
mean = 5000000
scale = time

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 16
max = 64
mean = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 32768
mean = 32768
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
mean = 0.1
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
mean = 9.978834549661439e-05
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
mean = 0.9895392516590218
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.6
mean = 0.8913863793240697
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.0
max = 5.0
mean = 1.293515737115144
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.0
max = 5.0
mean = 0.9441201980744335
scale = auto

#[sweep.train.update_epochs]
#distribution = int_uniform
#min = 1
#max = 8
#mean = 1
#scale = 2.0

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 1.0
mean = 0.43061293889547203
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 5.0
mean = 2.034621033242285
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.0
max = 5.0
mean = 5
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.0
mean = 2.1344086565175218
max = 5.0
scale = auto

[sweep.train.adam_beta1]
distribution = logit_normal
min = 0.5
mean = 0.8491540796549305
max = 0.999
scale = auto

[sweep.train.adam_beta2]
distribution = logit_normal
min = 0.9
mean = 0.9897345075048444
max = 0.99999
scale = auto

[sweep.train.adam_eps]
distribution = log_normal
min = 1e-14
